# RAFTcorr CI Pipeline
#
# Runs backend (Python/Flask) and frontend (React/Vite) tests in parallel.
#
# Status badges (add to README.md):
#   ![CI](https://github.com/zachtong/RAFTcorr/actions/workflows/ci.yml/badge.svg)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend Tests (Python / Flask / pytest)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install testing tools
          pip install pytest pytest-cov
          # Install project dependencies (use opencv-python-headless for CI,
          # skip weasyprint which needs system-level libs not required for tests)
          pip install \
            numpy \
            opencv-python-headless \
            Pillow \
            scipy \
            matplotlib \
            tifffile \
            numba \
            flask \
            flask-cors \
            flask-socketio \
            jinja2

      - name: Run backend tests with coverage
        run: |
          pytest server/tests/ \
            --cov=server \
            --cov-report=term \
            --cov-report=html:backend-coverage \
            --tb=short \
            -q

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend-coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Tests + Build (React / TypeScript / Vite)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests & Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
